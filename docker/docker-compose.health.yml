# Apple Watch / Apple Health ingest (iOS Shortcuts or Health Auto Export -> InfluxDB).
# Kept in its own file so it layers on top of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.health.yml up -d --build health-ingest
# Needs HEALTH_TOKENS in docker/.env; see health-ingest/README.md.
services:
  health-ingest:
    build:
      context: ./health-ingest
    image: ruview/health-ingest:latest
    container_name: ruview-health-ingest
    restart: unless-stopped
    depends_on:
      - influxdb
    networks:
      - ruview-data
    # Bind to the NAS LAN address in .env if you prefer (HEALTH_INGEST_BIND=192.168.1.195).
    ports:
      - "${HEALTH_INGEST_BIND:-0.0.0.0}:${HEALTH_INGEST_PORT:-8095}:8095"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8095/health',timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
    environment:
      - HEALTH_TOKENS
      - INFLUXDB_URL=http://influxdb:8086
      # Taken from docker/.env (same token the influxdb service was set up with).
      - INFLUXDB_TOKEN
      - INFLUXDB_ORG=${INFLUXDB_ORG:-ruview}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensing}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
