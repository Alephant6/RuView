# Telegraf config: subscribe to ruview/# on MQTT and write to InfluxDB.
#
# MQTT consumers run in parallel so each topic family gets its own
# parser + measurement name + tags:
#   ruview/state        -> measurement="state"   (mqtt-bridge)
#   ruview/nodes/<id>   -> measurement="node",   tag node_id
#   ruview/person/<key> -> measurement="person", tag key (slot or label)
#   homeassistant/sensor/wifi_densepose_*/<e>/state        -> "ha_sensor"
#   homeassistant/binary_sensor/wifi_densepose_*/<e>/state -> "ha_binary"
#   homeassistant/event/wifi_densepose_*/<e>/state         -> "ha_event"
#     (sensing-server built-in publisher, tags device + entity)
#
# All connect to the same broker with the same credentials (env-substituted
# from docker-compose). Reconnect is automatic.

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "ruview-telegraf"
  omit_hostname = false

# ──────────────────────────────────────────────────────────────────────────
# Output: InfluxDB v2
# ──────────────────────────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# ──────────────────────────────────────────────────────────────────────────
# Input: global sensing state (ruview/state)
# Payload shape (see docker/bridge/bridge.py translate()):
#   { presence, confidence, motion_level, motion_energy,
#     breathing_rate_bpm, heart_rate_bpm, signal_quality,
#     n_persons, source, active_nodes, fall_detected, tick, ts }
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "state"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-state"
  data_format = "json"
  json_string_fields = ["motion_level", "source"]
  tag_keys = ["motion_level", "source"]
  # `presence` and `fall_detected` are JSON booleans — telegraf maps to
  # 0/1 floats which is what Grafana time-series wants anyway.

# ──────────────────────────────────────────────────────────────────────────
# Input: per-node telemetry (ruview/nodes/<id>)
# Payload: { node_id, rssi_dbm, subcarrier_count, position }
# Tag node_id from the topic so each node is its own series.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "node"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/nodes/+"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-nodes"
  data_format = "json"
  # Extract the last topic segment (<id>) as a tag.
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${MQTT_PREFIX}/nodes/+"
    tags = "_/_/node_id"

# ──────────────────────────────────────────────────────────────────────────
# Input: per-person slot/label state (ruview/person/<key>)
# Payload (occupied): { occupied, track_id, confidence, x, y, z, zone, label? }
# Payload (empty):    { occupied: false }
# Tag the topic key (slot number "1" / "2" or label "alice" / "bob").
# Skips the ".../avail" subtopics — those are pure availability strings.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "person"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/person/+"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-persons"
  data_format = "json"
  json_string_fields = ["zone", "label"]
  tag_keys = ["zone", "label"]
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${MQTT_PREFIX}/person/+"
    tags = "_/_/person_key"

# ──────────────────────────────────────────────────────────────────────────
# Input: sensing-server built-in publisher (ADR-115), numeric sensors
# Topic: ${HA_DISCOVERY_PREFIX}/sensor/wifi_densepose_<client>-node<N>/<entity>/state
# Payload is JSON, one shape per entity:
#   heart_rate / breathing_rate -> { bpm, confidence, ts }
#   person_count                -> { n_persons, ts }
#   motion_level                -> { level_pct, ts }
#   motion_energy               -> { energy, ts }
#   presence_score              -> { score_pct, ts }
#   rssi                        -> { dbm, ts }
#   fall_risk_elevated          -> { score, ts }
# Tags: device (wifi_densepose_ruview-node1, ...) and entity (heart_rate, ...).
# The topic wildcard also matches other integrations' sensors, so tagpass
# keeps only RuView devices.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "ha_sensor"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${HA_DISCOVERY_PREFIX}/sensor/+/+/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-ha-sensor"
  data_format = "json"
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_DISCOVERY_PREFIX}/sensor/+/+/state"
    tags = "_/_/device/entity/_"
  [inputs.mqtt_consumer.tagpass]
    device = ["wifi_densepose_*"]

# ──────────────────────────────────────────────────────────────────────────
# Input: sensing-server built-in publisher, binary sensors (ON / OFF)
# presence and the semantic states: someone_sleeping,
# possible_distress, room_active, elderly_inactivity_anomaly,
# meeting_in_progress, bathroom_occupied, bed_exit, no_movement, ...
# Stored as measurement ha_binary, field `on` = 1 / 0 (see processors.enum).
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "ha_binary"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${HA_DISCOVERY_PREFIX}/binary_sensor/+/+/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-ha-binary"
  data_format = "value"
  data_type = "string"
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_DISCOVERY_PREFIX}/binary_sensor/+/+/state"
    tags = "_/_/device/entity/_"
  [inputs.mqtt_consumer.tagpass]
    device = ["wifi_densepose_*"]

# ──────────────────────────────────────────────────────────────────────────
# Input: sensing-server built-in publisher, one-shot events
# fall, bed_exit, multi_room_transition -> { event_type, ts, confidence? }
# Stored as measurement ha_event (field event_type, plus confidence if sent).
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "ha_event"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${HA_DISCOVERY_PREFIX}/event/+/+/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-ha-event"
  data_format = "json"
  json_string_fields = ["event_type"]
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_DISCOVERY_PREFIX}/event/+/+/state"
    tags = "_/_/device/entity/_"
  [inputs.mqtt_consumer.tagpass]
    device = ["wifi_densepose_*"]

[[processors.enum]]
  namepass = ["ha_binary"]
  [[processors.enum.mapping]]
    field = "value"
    dest = "on"
    [processors.enum.mapping.value_mappings]
      ON = 1
      OFF = 0
