# Telegraf config: subscribe to ruview/# on MQTT and write to InfluxDB.
#
# MQTT consumers run in parallel so each topic family gets its own
# parser + measurement name + tags:
#   ruview/state        -> measurement="state"   (mqtt-bridge)
#   ruview/nodes/<id>   -> measurement="node",   tag node_id
#   ruview/person/<key> -> measurement="person", tag key (slot or label)
#   ruview/bridge       -> measurement="bridge"  (mqtt-bridge stream health)
#   ruview/watchdog/metrics -> measurement="watchdog" (analytics watchdog)
#   ruview/recorder/status  -> measurement="recorder" (csi-recorder health)
#   ruview/recorder/keep/result -> measurement="recorder_keep" (kept clips)
#   ruview/annotation       -> measurement="annotation" (HA label buttons)
#   homeassistant/sensor/wifi_densepose_*/<e>/state        -> "ha_sensor"
#   homeassistant/binary_sensor/wifi_densepose_*/<e>/state -> "ha_binary"
#   homeassistant/event/wifi_densepose_*/<e>/state         -> "ha_event"
#     (sensing-server built-in publisher, tags device + entity)
#
# All connect to the same broker with the same credentials (env-substituted
# from docker-compose). Reconnect is automatic.

[agent]
  interval = "5s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "ruview-telegraf"
  omit_hostname = false

# ──────────────────────────────────────────────────────────────────────────
# Output: InfluxDB v2
# ──────────────────────────────────────────────────────────────────────────
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# ──────────────────────────────────────────────────────────────────────────
# Input: global sensing state (ruview/state)
# Payload shape (see docker/bridge/bridge.py translate()):
#   { presence, confidence, motion_level, motion_energy,
#     breathing_rate_bpm, heart_rate_bpm, signal_quality, hr_conf, br_conf,
#     vitals_present, n_persons, calibrated, cal_person_count, room_class,
#     room_conf, source, stale_source, active_nodes, fresh_nodes,
#     fall_detected, abstention_reason, numeric_vitals_authorized,
#     calibration_fresh, tick, ts }
# Withheld vitals arrive as JSON null and are skipped, so a gap in
# heart_rate_bpm means "not published", never 0 bpm. One point per new
# server tick, at most STATE_MAX_HZ (bridge default 10 Hz).
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "state"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-state"
  data_format = "json"
  # The json parser drops JSON booleans unless they are listed here; the
  # converter at the end of this file then stores them as integers 1/0.
  json_string_fields = ["motion_level", "source", "abstention_reason", "room_class",
                        "presence", "vitals_present", "calibrated", "stale_source",
                        "fall_detected", "numeric_vitals_authorized", "calibration_fresh"]
  tag_keys = ["motion_level", "source"]

# ──────────────────────────────────────────────────────────────────────────
# Input: per-node telemetry (ruview/nodes/<id>), at most 1 Hz per node
# Payload: { node_id, rssi_dbm, csi_fps, stale, last_seen_ms, motion_level,
#            person_score, subcarrier_count?, position? }
# (subcarrier_count / position only while the node is fresh)
# Tag node_id from the topic so each node is its own series.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "node"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/nodes/+"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-nodes"
  data_format = "json"
  json_string_fields = ["motion_level", "stale"]
  # Extract the last topic segment (<id>) as a tag.
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${MQTT_PREFIX}/nodes/+"
    tags = "_/_/node_id"

# ──────────────────────────────────────────────────────────────────────────
# Input: per-person slot/label state (ruview/person/<key>)
# Payload (occupied): { occupied, track_id, confidence, x, y, z, zone, label? }
# Payload (empty):    { occupied: false }
# Tag the topic key (slot number "1" / "2" or label "alice" / "bob").
# Skips the ".../avail" subtopics — those are pure availability strings.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "person"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/person/+"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-persons"
  data_format = "json"
  json_string_fields = ["zone", "label", "occupied"]
  tag_keys = ["zone", "label"]
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${MQTT_PREFIX}/person/+"
    tags = "_/_/person_key"

# ──────────────────────────────────────────────────────────────────────────
# Input: bridge stream health (ruview/bridge, retained, every 10 s)
# Payload: { ts, ws_connected, source, stale_source, last_tick,
#            last_update_ts, last_new_tick_age_s, msgs_in_hz, new_ticks_hz,
#            duplicates_hz, state_published_hz, state_throttled_hz,
#            edge_vitals_in_hz, state_max_hz }
# new_ticks_hz near 0 with ws_connected = true means the server is only
# re-broadcasting its last update: the CSI source has stalled.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "bridge"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/bridge"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-bridge"
  data_format = "json"
  json_string_fields = ["source", "ws_connected", "stale_source"]

# ──────────────────────────────────────────────────────────────────────────
# Input: data watchdog (docker/analytics), one point per check round
# Payload: flat numbers, e.g. { status_level, critical, warning, info,
#            check_node_2, check_vitals_frozen, ... }  (check_* = 1 raised,
#            0 ok, absent = unknown)
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "watchdog"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/watchdog/metrics"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-watchdog"
  data_format = "json"

# ──────────────────────────────────────────────────────────────────────────
# Input: raw CSI recorder health (ruview/recorder/status, retained, every 30 s)
# Payload: { ts, recording, datagrams_hz, bytes_hz, kinds_hz: {csi, sync, ...},
#            nodes: {"1": {hz, csi_hz, age_s}, ...}, last_datagram_age_s,
#            datagrams_total, ring_files, ring_bytes, ring_hours, disk_free_gb,
#            disk_low, dropped, write_errors, kernel_drops, keep_pending,
#            keep_today_min, keep_budget_min, last_error, ... }
# Nested objects flatten to kinds_hz_csi, nodes_1_csi_hz, ...
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "recorder"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/recorder/status"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-recorder"
  data_format = "json"
  json_string_fields = ["last_error", "recording", "disk_low"]

# ──────────────────────────────────────────────────────────────────────────
# Input: csi-recorder keep results (ruview/recorder/keep/result)
# Payload: { status: accepted | duplicate | rejected | kept | empty | failed,
#            id, tag, start, end, duration_s, person, source, error?,
#            file?, records?, bytes?, coverage?, kinds?, nodes?, ts }
# QoS 1 with a persistent session: results published while Telegraf
# restarts are delivered afterwards.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "recorder_keep"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/recorder/keep/result"]
  qos = 1
  persistent_session = true
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-recorder-keep"
  data_format = "json"
  tag_keys = ["status", "tag", "source"]
  json_string_fields = ["id", "person", "start", "end", "file", "error"]

# ──────────────────────────────────────────────────────────────────────────
# Input: annotations from the HA label buttons (analytics/ha/ruview-labels.yaml)
# Payload: { kind, label, action: mark | start | stop, ts (epoch ms), person,
#            source, value: 1, text? }
# Stored at the press time (ts). QoS 1 with a persistent session, as above.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "annotation"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${MQTT_PREFIX}/annotation"]
  qos = 1
  persistent_session = true
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-annotation"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  tag_keys = ["kind", "label", "action", "person", "source"]
  json_string_fields = ["text"]

# ──────────────────────────────────────────────────────────────────────────
# Input: sensing-server built-in publisher (ADR-115), numeric sensors
# Topic: ${HA_DISCOVERY_PREFIX}/sensor/wifi_densepose_<client>-node<N>/<entity>/state
# Payload is JSON, one shape per entity:
#   heart_rate / breathing_rate -> { bpm, confidence, ts }
#   person_count                -> { n_persons, ts }
#   motion_level                -> { level_pct, ts }
#   motion_energy               -> { energy, ts }
#   presence_score              -> { score_pct, ts }
#   rssi                        -> { dbm, ts }
#   fall_risk_elevated          -> { score, ts }
# Tags: device (wifi_densepose_ruview-node1, ...) and entity (heart_rate, ...).
# The topic wildcard also matches other integrations' sensors, so tagpass
# keeps only RuView devices.
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "ha_sensor"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${HA_DISCOVERY_PREFIX}/sensor/+/+/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-ha-sensor"
  data_format = "json"
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_DISCOVERY_PREFIX}/sensor/+/+/state"
    tags = "_/_/device/entity/_"
  [inputs.mqtt_consumer.tagpass]
    device = ["wifi_densepose_*"]

# ──────────────────────────────────────────────────────────────────────────
# Input: sensing-server built-in publisher, binary sensors (ON / OFF)
# presence and the semantic states: someone_sleeping,
# possible_distress, room_active, elderly_inactivity_anomaly,
# meeting_in_progress, bathroom_occupied, bed_exit, no_movement, ...
# Stored as measurement ha_binary, field `on` = 1 / 0 (see processors.enum).
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "ha_binary"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${HA_DISCOVERY_PREFIX}/binary_sensor/+/+/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-ha-binary"
  data_format = "value"
  data_type = "string"
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_DISCOVERY_PREFIX}/binary_sensor/+/+/state"
    tags = "_/_/device/entity/_"
  [inputs.mqtt_consumer.tagpass]
    device = ["wifi_densepose_*"]

# ──────────────────────────────────────────────────────────────────────────
# Input: sensing-server built-in publisher, one-shot events
# fall, bed_exit, multi_room_transition -> { event_type, ts, confidence? }
# Stored as measurement ha_event (field event_type, plus confidence if sent).
# ──────────────────────────────────────────────────────────────────────────
[[inputs.mqtt_consumer]]
  name_override = "ha_event"
  servers = ["tcp://${MQTT_HOST}:${MQTT_PORT}"]
  topics = ["${HA_DISCOVERY_PREFIX}/event/+/+/state"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "ruview-telegraf-ha-event"
  data_format = "json"
  json_string_fields = ["event_type"]
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "${HA_DISCOVERY_PREFIX}/event/+/+/state"
    tags = "_/_/device/entity/_"
  [inputs.mqtt_consumer.tagpass]
    device = ["wifi_densepose_*"]

[[processors.enum]]
  namepass = ["ha_binary"]
  order = 2
  [[processors.enum.mapping]]
    field = "value"
    dest = "on"
    [processors.enum.mapping.value_mappings]
      ON = 1
      OFF = 0

# JSON booleans kept above (presence, fall_detected, stale, occupied, the
# vitals quality flags, ...) are stored as integers 1/0, so a dashboard or
# query can take their max or mean like any other number. Without
# json_string_fields the json parser would drop them altogether.
[[processors.converter]]
  namepass = ["state", "node", "person", "bridge", "recorder"]
  order = 1
  [processors.converter.fields]
    integer = ["presence", "vitals_present", "calibrated", "stale_source", "fall_detected",
               "numeric_vitals_authorized", "calibration_fresh", "stale", "occupied",
               "ws_connected", "recording", "disk_low"]
