# Images are built by CI (.github/workflows/fork-images.yml, WP0.1) and pulled
# from GHCR; the NAS never compiles. Pin a build with IMAGE_TAG=sha-<7> in .env
# and roll back by setting it to the previous SHA:
#   docker compose pull && docker compose up -d
# `build:` stays so a dev machine can still `docker compose build` locally.
services:
  # ── NAS message bus (docker/mosquitto, WP1.1) ───────────────────────────
  # Every RuView service below publishes and subscribes here, so ingest keeps
  # running while Home Assistant restarts or upgrades. start.sh bridges the
  # topics Home Assistant uses (entities, availability, label buttons) to
  # its broker at MQTT_HOST with the MQTT_USER / MQTT_PASS login; the rest,
  # notably <prefix>/state at up to 10 Hz, stays on the NAS. Containers
  # reach the bus as mosquitto:1883 on the ruview-bus network, host-network
  # services on 127.0.0.1:${MQTT_BUS_PORT:-1883}. See mosquitto/README.md.
  mosquitto:
    # eclipse-mosquitto with mosquitto.conf and start.sh baked in.
    build:
      context: ./mosquitto
      dockerfile: Dockerfile
    image: ghcr.io/alephant6/ruview-mosquitto:${IMAGE_TAG:-latest}
    container_name: ruview-mosquitto
    restart: unless-stopped
    networks:
      - ruview-bus
    ports:
      # Loopback only: clients connect without a password.
      - "127.0.0.1:${MQTT_BUS_PORT:-1883}:1883"
    environment:
      # Home Assistant's broker, the one the services used before the bus.
      # Empty MQTT_HOST runs the bus without the bridge.
      - MQTT_HOST=${MQTT_HOST:-homeassistant.local}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASS
      - MQTT_PREFIX=${MQTT_PREFIX:-ruview}
      - HA_DISCOVERY_PREFIX=${HA_DISCOVERY_PREFIX:-homeassistant}
    volumes:
      # Retained messages and queued messages for the bridge.
      - mosquitto-data:/mosquitto/data
    # The image's mosquitto user owns /mosquitto/data; start.sh writes the
    # generated config, which holds the bridge password, to /tmp.
    user: "1883:1883"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # The broker's uptime is retained, so this returns at once while it runs.
      test: ["CMD", "mosquitto_sub", "-h", "127.0.0.1", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "5"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  sensing-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust
    image: ghcr.io/alephant6/ruview-sensing-server:${IMAGE_TAG:-latest}
    container_name: ruview-sensing-server
    network_mode: host
    # ports:
    #   - "3000:3000"      # REST API + UI
    #   - "3001:3001"      # WebSocket  (/ws/sensing, /ws/introspection)
    #   - "5005:5005/udp"  # ESP32 CSI / fused-vitals (magic 0xC511000{2,4})
    environment:
      - RUST_LOG=info
      # CSI_SOURCE controls the data source for the sensing server.
      # Options: auto (default) — probe for ESP32 UDP then host WiFi; **fail
      #                           hard with exit 78 if neither is detected**.
      #                           Synthetic data is no longer a silent fallback
      #                           (issue #937 fix) — operators must opt in.
      #          esp32          — receive real CSI frames from an ESP32 on UDP port 5005
      #          wifi           — use host Wi-Fi RSSI/scan data (Windows netsh)
      #          simulated      — generate synthetic CSI data (no hardware required)
      - CSI_SOURCE=esp32
      # MODELS_DIR controls where the server scans for .rvf model files.
      # Mount a host directory and set this to make models visible:
      #   volumes: ["/path/to/models:/app/models"]
      #   MODELS_DIR=/app/models
      - MODELS_DIR=${MODELS_DIR:-/app/models}
      # Physical positions of the ESP32-S3 sensing nodes, in metres. Format:
      # "node_id:x,y,z;..." (upstream keys unprefixed entries by list index
      # from 0, so keep the explicit node_id: prefix). Origin and axis
      # convention are arbitrary as long as you use the same frame for every
      # node and (later) for any per-room zone definitions.
      #
      # Current deployment (measured 2026-05-17):
      #   node 1: (9.20, 8.10, 0.63 m)
      #   node 2: (6.45, 0.20, 0.70 m)
      #   node 3: (0.00, 4.65, 1.15 m)
      - SENSING_NODE_POSITIONS=${SENSING_NODE_POSITIONS:-1:9.2,8.1,0.63;2:6.45,0.2,0.7;3:0,4.65,1.15}
      # Enrolled-profile directory (one JSON file per household member).
      # When populated, single-person ticks are matched against these profiles
      # so PersonDetection.label carries the resolved name ("alice", "bob").
      # The bridge then publishes named HA entities (sensor.alice_present, ...).
      # Leave empty to disable name resolution (fallback to person_1 / person_2).
      - SENSING_PROFILES_DIR=${SENSING_PROFILES_DIR:-/app/data/profiles}
      # Upstream auth (issue #864): the entrypoint refuses to start (exit 64)
      # unless RUVIEW_API_TOKEN is set, RUVIEW_ALLOW_UNAUTHENTICATED=1, or
      # RUVIEW_BIND_ADDR is loopback. Set one of them in docker/.env.
      - RUVIEW_API_TOKEN
      - RUVIEW_ALLOW_UNAUTHENTICATED
      - RUVIEW_BIND_ADDR
      # Upstream UDP source guard (ADR-296): UDP binds 127.0.0.1 unless one of
      # these is set, so ESP32 frames from the LAN need e.g.
      # RUVIEW_UDP_ALLOW=192.168.1.0/24 (preferred) or RUVIEW_UDP_INSECURE_LAN=true.
      # Defaults to the home LAN; narrow to the three node IPs in .env if desired.
      - RUVIEW_UDP_ALLOW=${RUVIEW_UDP_ALLOW:-192.168.1.0/24}
      - RUVIEW_UDP_INSECURE_LAN
      - RUVIEW_UDP_BIND
      # Raw datagram copy for the csi-recorder below (ADR-380 udp tee):
      # every admitted UDP datagram, unchanged, to loopback only. Set
      # RUVIEW_UDP_TEE= (empty) in .env to switch it off.
      - RUVIEW_UDP_TEE=${RUVIEW_UDP_TEE-127.0.0.1:5006}
      # Host-header allowlist (upstream host_validation): requests whose Host is
      # not loopback or listed here get HTTP 421. mqtt-bridge connects to
      # ws://192.168.1.195:3001 and browsers may use nas.local, so list both.
      - SENSING_ALLOWED_HOSTS=${SENSING_ALLOWED_HOSTS:-192.168.1.195,nas.local,ruview-installation.local}
      # Built-in MQTT publisher (ADR-115): owns the room-level HA entities
      # (presence, HR/BR, person count, motion, fall, RSSI) per node, plus the
      # semantic states (sleeping, distress, bed exit, fall risk, no movement,
      # ...). State topics: homeassistant/<component>/wifi_densepose_ruview-node<N>/<entity>/state.
      # The mqtt-bridge below keeps the per-person / enrolled-name entities.
      # Publishes to the NAS bus (mosquitto below) on the host's loopback,
      # which passes these topics on to Home Assistant's broker.
      - RUVIEW_MQTT=${RUVIEW_MQTT:-true}
      - RUVIEW_MQTT_HOST=127.0.0.1
      - RUVIEW_MQTT_PORT=${MQTT_BUS_PORT:-1883}
      # Fixed client id so HA device ids and topics stay stable across rebuilds.
      - RUVIEW_MQTT_CLIENT_ID=${RUVIEW_MQTT_CLIENT_ID:-ruview}
      - RUVIEW_MQTT_PREFIX=${HA_DISCOVERY_PREFIX:-homeassistant}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - mosquitto
    restart: unless-stopped
    # No explicit command needed — docker-entrypoint.sh uses CSI_SOURCE.
    # Override with: command: ["--source", "esp32", "--tick-ms", "500"]

  # ── Home Assistant MQTT bridge ──────────────────────────────────────────
  # Subscribes to sensing-server's WebSocket and translates SensingUpdate JSON
  # into MQTT topics under ${MQTT_PREFIX}/ (read by Telegraf). Publishes HA
  # discovery for the per-person slot and enrolled-name entities, which the
  # built-in publisher does not have. Source in ./bridge/.
  mqtt-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    image: ghcr.io/alephant6/ruview-mqtt-bridge:${IMAGE_TAG:-latest}
    container_name: ruview-mqtt-bridge
    depends_on:
      - sensing-server
      - mosquitto
    networks:
      - ruview-bus
    environment:
      # Inside the compose network we can reach the sensing-server by name.
      - RUVIEW_WS=ws://192.168.1.195:3001/ws/sensing
      # Same token as sensing-server; sent as a bearer header on the WS upgrade.
      - RUVIEW_API_TOKEN
      # The NAS bus. Only the topics Home Assistant uses cross to its broker;
      # with ROOM_ENTITIES=true, <prefix>/state (up to STATE_MAX_HZ) would
      # also have to be added to the bridge in mosquitto/start.sh.
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_PREFIX=${MQTT_PREFIX:-ruview}
      - HA_DISCOVERY_PREFIX=${HA_DISCOVERY_PREFIX:-homeassistant}
      - DEVICE_NAME=${DEVICE_NAME:-RuView Sensing}
      - DEVICE_ID=${DEVICE_ID:-ruview}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # false while sensing-server's --mqtt owns the room-level entities: the
      # bridge retracts its old room-level discovery configs and only keeps the
      # per-person slot and enrolled-name entities.
      - ROOM_ENTITIES=${ROOM_ENTITIES:-false}
      # Publish limits: ruview/state per new tick up to STATE_MAX_HZ, each
      # ruview/nodes/<id> up to NODE_MAX_HZ, person slots on change (at most
      # PERSON_MAX_HZ) plus a heartbeat. Bridge health goes to ruview/bridge.
      - STATE_MAX_HZ=${STATE_MAX_HZ:-10}
      - NODE_MAX_HZ=${NODE_MAX_HZ:-1}
      - PERSON_MAX_HZ=${PERSON_MAX_HZ:-1}
    restart: unless-stopped

  # ── Data watchdog (docker/analytics, WP0.4) ─────────────────────────────
  # Checks the bridge, server, CSI source, each node, frozen/implausible
  # vitals and calibration; publishes problems to HA as "RuView Watchdog"
  # entities. Example push automations: analytics/ha/watchdog-notify.yaml.
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    image: ghcr.io/alephant6/ruview-analytics:${IMAGE_TAG:-latest}
    container_name: ruview-analytics
    depends_on:
      - mqtt-bridge
      - mosquitto
    networks:
      - ruview-bus
    environment:
      - RUVIEW_HTTP=${RUVIEW_HTTP:-http://192.168.1.195:3000}
      - RUVIEW_API_TOKEN
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_PREFIX=${MQTT_PREFIX:-ruview}
      - HA_DISCOVERY_PREFIX=${HA_DISCOVERY_PREFIX:-homeassistant}
      - EXPECTED_NODES=${EXPECTED_NODES:-1,2,3}
      # Optional phone-presence check: HA URL, a long-lived token and the
      # person entities, e.g. HA_PERSONS=person.alice,person.bob. The token
      # is passed through from docker/.env, like RUVIEW_API_TOKEN.
      - HA_URL=${HA_URL:-}
      - HA_TOKEN
      - HA_PERSONS=${HA_PERSONS:-}
      - WATCHDOG_LANG=${WATCHDOG_LANG:-zh}
      # Minutes of raw CSI the csi-recorder keeps when a vitals or presence
      # problem is raised (0 = off).
      - KEEP_ON_RAISE_MIN=${KEEP_ON_RAISE_MIN:-20}
      # Automatic empty-room calibration (off unless AUTOCAL_SOURCE_NODE is
      # set; needs the phone-presence settings above and RUVIEW_API_TOKEN).
      - AUTOCAL_SOURCE_NODE=${AUTOCAL_SOURCE_NODE:-}
      - AUTOCAL_AWAY_MIN=${AUTOCAL_AWAY_MIN:-10}
      - AUTOCAL_REFRESH_H=${AUTOCAL_REFRESH_H:-6}
      - AUTOCAL_MAX_MOVING=${AUTOCAL_MAX_MOVING:-0.25}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    # Reads MQTT and REST (its only REST writes are the calibration calls)
    # and writes nothing to disk: no capabilities needed.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    restart: unless-stopped

  # ── Raw CSI recorder (docker/csi-recorder, WP0.5) ──────────────────────
  # Writes every datagram the sensing-server tees to 127.0.0.1:5006 into
  # hourly .csi.raw.gz files, keeps the last RING_HOURS, and copies ranges
  # requested on ruview/recorder/keep (HA label buttons, watchdog) into
  # permanent clips. Raw CSI is person data (ADR-299): it stays on this
  # volume. The directory must be writable by uid 65534 (nobody); without
  # sudo, and with ./data owned by root (the sensing-server mounts it):
  #   docker run --rm -v "$PWD/data:/d" alpine:3.20 sh -c 'mkdir -p /d/csi && chown 65534:65534 /d/csi'
  csi-recorder:
    build:
      context: ./csi-recorder
      dockerfile: Dockerfile
    image: ghcr.io/alephant6/ruview-csi-recorder:${IMAGE_TAG:-latest}
    container_name: ruview-csi-recorder
    # Host network: the tee sends to the host's loopback.
    network_mode: host
    environment:
      - RECORDER_LISTEN=${RECORDER_LISTEN:-127.0.0.1:5006}
      - RING_HOURS=${RING_HOURS:-72}
      - RING_MAX_GB=${RING_MAX_GB:-20}
      - MIN_FREE_GB=${MIN_FREE_GB:-2}
      - KEEP_MAX_MIN=${KEEP_MAX_MIN:-120}
      - KEEP_MAX_H_PER_DAY=${KEEP_MAX_H_PER_DAY:-2}
      # The NAS bus, on the host's loopback.
      - MQTT_HOST=127.0.0.1
      - MQTT_PORT=${MQTT_BUS_PORT:-1883}
      - MQTT_PREFIX=${MQTT_PREFIX:-ruview}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - mosquitto
    volumes:
      - ${CSI_DATA_DIR:-./data/csi}:/data
    # Writes only to /data; binds an unprivileged loopback port.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # Lets an unfinished clip extraction stop cleanly; it resumes after a restart.
    stop_grace_period: 30s
    restart: unless-stopped

  # ── InfluxDB 2.x ─────────────────────────────────────────────────────────
  # Time-series store for everything the bridge publishes. Telegraf writes
  # here; Grafana reads from here. Defaults are intentionally weak (single
  # admin token, no TLS) — fine for a LAN-only deployment, override via
  # `.env` for anything exposed beyond the home network.
  influxdb:
    image: influxdb:2.7
    container_name: ruview-influxdb
    restart: unless-stopped
    networks:
      - ruview-data
    ports:
      - "${INFLUXDB_PORT:-8086}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-ruview-admin-change-me}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-ruview}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensing}
      - DOCKER_INFLUXDB_INIT_RETENTION=${INFLUXDB_RETENTION:-30d}
      # Pre-shared token so Telegraf and Grafana can be wired up
      # deterministically. Change this in .env before first start.
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-ruview-local-dev-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  # ── TimescaleDB (WP1.1) ──────────────────────────────────────────────────
  # PostgreSQL 17 with TimescaleDB, the store that replaces InfluxDB; Telegraf
  # writes to both until InfluxDB is retired (WP1.5). Tables, roles,
  # aggregates and retention come from ./timescaledb/migrations, applied by
  # db-migrate below (see timescaledb/README.md). Containers on ruview-data
  # reach it as timescaledb:5432; on the NAS it listens on 127.0.0.1 only
  # unless PG_BIND says otherwise. This is the Timescale License build: the
  # -oss images lack compression, continuous aggregates and policies.
  timescaledb:
    # Keep the tag in step with timescaledb/Dockerfile (db-migrate).
    image: timescale/timescaledb:2.30.2-pg17
    container_name: ruview-timescaledb
    restart: unless-stopped
    networks:
      - ruview-data
    ports:
      - "${PG_BIND:-127.0.0.1}:${PG_PORT:-5432}:5432"
    environment:
      # Superuser password, fixed when the volume is first created.
      - POSTGRES_PASSWORD
      - POSTGRES_DB=ruview
      - TIMESCALEDB_TELEMETRY=off
      # timescaledb-tune sizes Postgres for this much memory and CPU when the
      # volume is first created.
      - TS_TUNE_MEMORY=${PG_MEMORY:-1GB}
      - TS_TUNE_NUM_CPUS=${PG_CPUS:-2}
      - TS_TUNE_MAX_CONNS=40
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    shm_size: 256m
    # The image's postgres user (uid 70) owns the data volume, so the server
    # needs neither root nor any capability.
    user: postgres
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # TCP, so the temporary server of the first start does not count.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "ruview"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s

  # Applies new ./timescaledb/migrations and the service roles' passwords from
  # .env, then exits. Runs at every `docker compose up -d`; on its own:
  #   docker compose run --rm db-migrate
  db-migrate:
    # The timescaledb image with migrate.sh and the migrations baked in.
    build:
      context: ./timescaledb
      dockerfile: Dockerfile
    image: ghcr.io/alephant6/ruview-db-migrate:${IMAGE_TAG:-latest}
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - ruview-data
    user: postgres
    environment:
      - PGHOST=timescaledb
      - PGDATABASE=ruview
      - POSTGRES_PASSWORD
      - PG_TELEGRAF_PASSWORD
      - PG_ANALYTICS_PASSWORD
      - PG_GRAFANA_PASSWORD
      - PG_LLM_RO_PASSWORD
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    # A one-shot job: it exits once the migrations are applied.
    healthcheck:
      disable: true
    restart: "no"

  # ── Telegraf MQTT → InfluxDB + TimescaleDB ───────────────────────────────
  # Subscribes to ruview/# and the built-in publisher's topics on the NAS
  # bus, parses each JSON payload, and writes it to InfluxDB and to
  # TimescaleDB (schema ingest). It does not wait for the database: if
  # TimescaleDB is down, Telegraf keeps writing InfluxDB and retries it at
  # every flush. It does wait for the bus, since it exits when it cannot
  # connect at startup.
  telegraf:
    image: telegraf:1.39.3
    container_name: ruview-telegraf
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_started
      mqtt-bridge:
        condition: service_started
      mosquitto:
        condition: service_healthy
    networks:
      - ruview-data
      - ruview-bus
    environment:
      # The bus needs no login. Set empty on purpose: Telegraf keeps an unset
      # ${MQTT_USER} in telegraf.conf as literal text.
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_USER=
      - MQTT_PASS=
      - MQTT_PREFIX=${MQTT_PREFIX:-ruview}
      - HA_DISCOVERY_PREFIX=${HA_DISCOVERY_PREFIX:-homeassistant}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-ruview-local-dev-token-change-me}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-ruview}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensing}
      - PG_HOST=timescaledb
      - PG_PORT=5432
      - PG_DATABASE=ruview
      - PG_TELEGRAF_PASSWORD
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  # ── Grafana ──────────────────────────────────────────────────────────────
  # Visualisation. Datasource + dashboards are provisioned on first start
  # from ./grafana/provisioning so a fresh deploy comes up with working
  # charts (Node RSSI / Vital Signs / Presence) — no manual import needed.
  # Port 3030 avoids the sensing-server's 3000/3001 (host-network mode).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: ruview-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    networks:
      - ruview-data
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-ruview-admin-change-me}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_USERS_ALLOW_SIGN_UP=false
      # Datasource provisioning needs these to pre-bake the InfluxDB connection
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-ruview-local-dev-token-change-me}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-ruview}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-sensing}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  ruview-data:
    driver: bridge
  # The bus and its clients only; the databases and Grafana are not on it.
  ruview-bus:
    driver: bridge

volumes:
  influxdb-data:
  influxdb-config:
  grafana-data:
  timescaledb-data:
  mosquitto-data:
