# RuView NAS message bus (WP1.1).
#
# Every RuView service on the NAS publishes and subscribes here, so ingest
# keeps running while Home Assistant restarts or upgrades. start.sh appends
# the bridge to Home Assistant's broker, which carries only the topics Home
# Assistant uses.
#
# Clients connect without a password: the port is published on the NAS
# loopback only (docker-compose.yml), and the other services reach it on the
# compose networks as mosquitto:1883.

# IPv4 only, like the compose networks; this also keeps an IPv6 warning out
# of the log on hosts without IPv6.
listener 1883 0.0.0.0
allow_anonymous true

# Retained messages (discovery configs, availability, the watchdog report) and
# queued messages survive a restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
